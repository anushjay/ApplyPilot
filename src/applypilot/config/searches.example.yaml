# ApplyPilot search configuration
# Copy to ~/.applypilot/searches.yaml and customize for your job search.
# The wizard (applypilot init) generates a basic version automatically.

# Search queries -- each has a query string and priority tier.
# Tier 1: High-priority exact matches (searched first, highest precision)
# Tier 2: Strong matches, broader scope
# Tier 3: Wide net, high volume, lower precision
queries:
  - query: "Technology Partnerships"
    tier: 1
  - query: "AI partnerships"
    tier: 1
  - query: "VP of Partnerships"
    tier: 1
  - query: "Partner Platforms"
    tier: 2
  - query: "Director of Partnerships"
    tier: 2
  - query: "Product Partnerships"
    tier: 2
  - query: "Director of AI solutions"
    tier: 2

# Locations to search
locations:
  - location: "Remote"
    remote: true
  - location: "San Francisco, CA"
    remote: false
  - location: "San Francisco Bay Area, CA"
    remote: false

# Location filtering -- accept/reject patterns for job location text
location:
  accept_patterns:
    - "San Francisco"
    - "San Francisco Bay Area"
    - "Bay Area"
    - "SF"
    - "Remote"
    - "Anywhere"
    - "Work from home"
    - "WFH"
    - "Distributed"
    - "California"
    - "CA"
    - "United States"
    - "US"
    - "USA"
  reject_patterns:
    - "New York only"
    - "Seattle only"
    - "onsite only"
    - "London, UK"
    - "India"
    - "Philippines"

# Country for Indeed/LinkedIn/Google Jobs searches
country: "USA"

# JobSpy source boards (all available options shown)
boards:
  - indeed
  - linkedin
  - glassdoor
  - zip_recruiter
  - google

# Search defaults
defaults:
  results_per_site: 100  # Max results per board per query
  hours_old: 72          # Only jobs posted within this many hours

# Negative keywords -- skip jobs with these in the title (case-insensitive)
exclude_titles:
  - "chief"
  - "intern"
  - "internship"
  - "co-op"
  - "clearance required"
  - "TS/SCI"
  - "principal scientist"
